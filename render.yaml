services:
  - type: web
    name: aerospeak-atc
    runtime: python
    region: oregon
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn server:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
    envVars:
      - key: GEMINI_KEY
        sync: false
      - key: ELEVEN_KEY
        sync: false
      - key: ATC_VOICE
        value: IKne3meq5aSn9XLyUdCD
      - key: GEMINI_MODEL
        value: gemini-3.1-flash-lite
      - key: GEMINI_LITE
        value: gemini-3.1-flash-lite
      - key: AEROSPEAK_ACCESS_CODE
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: aerospeak-accounts
          property: connectionString

databases:
  - name: aerospeak-accounts
    databaseName: aerospeak
    user: aerospeak
    region: oregon
    plan: free
