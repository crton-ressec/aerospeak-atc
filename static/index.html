<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>AeroSpeak ATC</title>
<style>
:root { --bg:#0b0e13; --panel:#131821; --edge:#1f2836; --txt:#dce4ee; --dim:#7a8799; --accent:#56c2a0; --warn:#ffb454; --danger:#e34; }
* { box-sizing:border-box; margin:0; padding:0; }
html, body { min-height:100%; }
body { background:var(--bg); color:var(--txt); font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif; display:flex; flex-direction:column; min-height:100vh; }
header { display:flex; align-items:center; justify-content:space-between; padding:14px 18px; border-bottom:1px solid var(--edge); }
.brand { font-weight:700; letter-spacing:.5px; font-size:17px; }.brand span { color:var(--accent); }
.freq { color:var(--dim); font-size:13px; font-variant-numeric:tabular-nums; }.freq b { color:var(--txt); font-weight:600; }
.gear { background:var(--panel); border:1px solid var(--edge); color:var(--txt); border-radius:8px; padding:4px 10px; font-size:15px; cursor:pointer; margin-left:10px; }
.settings { display:none; position:fixed; top:60px; right:16px; width:min(380px,92vw); max-height:calc(100vh - 76px); overflow-y:auto; background:var(--panel); border:1px solid var(--edge); border-radius:12px; padding:18px; z-index:20; box-shadow:0 20px 60px rgba(0,0,0,.5); }
.settings.open { display:block; }.settings h3 { font-size:16px; margin-bottom:12px; color:var(--accent); }
.settings label { display:block; font-size:12px; color:var(--dim); margin:12px 0; }.settings input,.settings select { width:100%; margin-top:4px; background:var(--bg); color:var(--txt); border:1px solid var(--edge); border-radius:8px; padding:8px 10px; font-size:15px; }
.airportbar { display:flex; flex-direction:column; gap:8px; padding:0 0 12px; border-bottom:1px solid var(--edge); }.aprow { position:relative; display:flex; }
.aprow input { margin:0; }.apresults { position:absolute; top:100%; left:0; right:0; background:var(--panel); border:1px solid var(--edge); border-radius:0 0 10px 10px; z-index:30; max-height:220px; overflow-y:auto; display:none; }.apresults.open { display:block; }
.ap { padding:9px 12px; font-size:13px; cursor:pointer; border-bottom:1px solid var(--edge); display:flex; justify-content:space-between; gap:8px; }.ap:last-child { border-bottom:none; }.ap b { color:var(--accent); }.ap:hover { background:#1a2230; }
.freqrow { display:flex; flex-wrap:wrap; gap:6px; }.freqrow .fbt { background:var(--bg); color:var(--dim); border:1px solid var(--edge); border-radius:20px; padding:6px 10px; font-size:12px; font-weight:600; cursor:pointer; }.freqrow .fbt.active { background:var(--accent); color:#081c14; border-color:var(--accent); }.freqrow .type { font-weight:700; margin-right:5px; }
.actions { display:flex; gap:8px; margin-top:14px; }.actions button,.sync,.refresh { flex:1; padding:9px; border-radius:8px; border:none; background:var(--accent); color:#081c14; font-weight:700; cursor:pointer; }.actions button.secondary,.refresh { background:var(--edge); color:var(--txt); }.sync { width:100%; margin-top:10px; background:#123d2f; color:var(--accent); border:1px solid var(--accent); }.refresh { width:100%; margin-top:8px; }.sync:disabled,.refresh:disabled { cursor:not-allowed; opacity:.45; }
.hint { margin-top:10px; color:var(--accent); font-size:12px; min-height:14px; }.planstatus { margin-top:8px; color:var(--dim); font-size:11px; line-height:1.45; white-space:pre-line; }.access { margin:12px 0; padding:10px; border:1px solid var(--edge); border-radius:8px; background:#101621; }.access p { color:var(--dim); font-size:11px; line-height:1.4; margin-bottom:8px; }.access button { width:100%; margin-top:6px; padding:8px; border:1px solid var(--edge); border-radius:8px; background:var(--edge); color:var(--txt); font-weight:700; cursor:pointer; }
main { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:26px; padding:24px; }.rx-ind { display:flex; align-items:center; gap:8px; color:var(--dim); font-size:13px; letter-spacing:1px; text-transform:uppercase; }.rx-ind .dot { width:9px; height:9px; border-radius:50%; background:var(--dim); }.rx-ind.live .dot { background:var(--danger); box-shadow:0 0 12px #e34a; animation:pulse 1.2s infinite; }@keyframes pulse { 50% { opacity:.35; } }
.meter { width:min(400px,82vw); height:10px; background:var(--panel); border:1px solid var(--edge); border-radius:6px; overflow:hidden; }.meter i { display:block; height:100%; width:0%; background:linear-gradient(90deg,#3d8,#2c6); transition:width .1s; }
button.ptt { width:190px; height:190px; border-radius:50%; border:3px solid var(--edge); background:radial-gradient(circle at 30% 30%,#1a2230,#12161e); color:var(--txt); font-size:19px; font-weight:700; letter-spacing:1px; cursor:pointer; user-select:none; -webkit-tap-highlight-color:transparent; touch-action:none; box-shadow:0 12px 30px rgba(0,0,0,.45); transition:transform .08s,background .08s; }button.ptt:active,button.ptt.hold { background:radial-gradient(circle at 30% 30%,#c0392b,#8e2a1f); transform:scale(.96); border-color:var(--danger); box-shadow:0 0 30px rgba(227,68,52,.35); }
.radiohint { color:var(--dim); font-size:13px; }.log { width:min(560px,92vw); max-height:190px; overflow-y:auto; border:1px solid var(--edge); border-radius:10px; background:var(--panel); padding:10px 12px; display:flex; flex-direction:column; gap:8px; }.msg { font-size:13px; line-height:1.5; }.who { font-weight:700; margin-right:6px; }.atc .who { color:var(--accent); }.sys { color:var(--dim); font-style:italic; }.playbtn { margin-top:4px; background:var(--panel); color:var(--accent); border:1px solid var(--edge); border-radius:8px; padding:7px 12px; font-size:13px; font-weight:700; cursor:pointer; }
footer { padding:10px 18px; border-top:1px solid var(--edge); color:var(--dim); font-size:11px; display:flex; justify-content:space-between; }
</style>
</head>
<body>
<header><div class="brand">Aero<span>Speak</span> ATC</div><div><span class="freq" id="freqBadge"></span><button class="gear" id="gear" title="Settings" aria-label="Settings">⚙</button></div></header>
<div class="settings" id="settings">
  <h3>Flight Setup</h3>
  <div class="airportbar">
    <div class="aprow"><input id="apsearch" type="search" placeholder="Airport override (ICAO or name)" autocomplete="off"><div class="apresults" id="apresults"></div></div>
    <div class="freqrow" id="freqrow"></div>
  </div>
  <label>SimBrief Pilot ID<input id="simbrief" type="text" inputmode="numeric" placeholder="e.g. 1053147" autocomplete="off"></label>
  <label>Your Callsign<input id="callsign" type="text" placeholder="e.g. FFT1407" autocomplete="off"></label>
  <label>Departure Gate or Stand (optional)<input id="gate" type="text" placeholder="e.g. B12" autocomplete="off"></label>
  <label>Arrival Gate or Stand (optional)<input id="arrivalGate" type="text" placeholder="e.g. C18" autocomplete="off"></label>
  <p class="hint" id="controllerStatus">Select an airport, then choose the controller frequency you are calling.</p>
  <div class="access" id="accessBlock" hidden><p>This deployment requires an access code before it can make live radio, ATIS, or SimBrief requests.</p><input id="accessCode" type="password" placeholder="Access code" autocomplete="off"><button id="unlock" type="button">Unlock Live Services</button></div>
  <div class="actions"><button id="save">Save</button><button class="secondary" id="close">Close</button></div>
  <button class="sync" id="syncPlan" type="button" disabled>Sync Flight Plan</button>
  <button class="refresh" id="validatePlan" type="button" disabled>Refresh Live Details</button>
  <p class="hint" id="saved"></p><p class="planstatus" id="planstatus"></p>
</div>
<main>
  <div class="rx-ind" id="rx"><span class="dot"></span><span>RX</span></div>
  <div class="meter"><i id="meter"></i></div>
  <button class="ptt" id="ptt">HOLD TO TALK</button>
  <div class="radiohint">Hold to transmit · release to hear ATC</div>
  <div class="log" id="log" aria-live="polite"></div>
</main>
<footer><span>AeroSpeak ATC <span id="ver"></span></span><span id="state">ready</span></footer>
<script src="/static/app.js"></script>
</body>
</html>
